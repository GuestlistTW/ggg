<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品照片盤點系統 (具備自動延遲機制)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.2s ease; }
        .drop-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
        .canvas-container { overflow: auto; max-height: 70vh; border: 1px solid #e2e8f0; background-color: #f8fafc; }
        canvas { cursor: crosshair; transform-origin: top left; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-20">

    <div class="max-w-5xl mx-auto p-4 sm:p-6">
        <!-- 標題與提醒 -->
        <header class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-blue-800 mb-2">商品照片盤點系統</h1>
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4 text-yellow-800 text-sm">
                <p class="font-bold">⚠️ 盤點提醒：</p>
                <p>若不同照片拍到「相同實體商品」，數量會被重複加總。請確認每張照片的拍攝範圍不重疊，或在人工確認時自行扣除。</p>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-white p-4 rounded-lg shadow-sm">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">業務姓名</label>
                    <input type="text" id="sales-name" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500" placeholder="請輸入姓名">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">盤點日期</label>
                    <input type="date" id="inventory-date" class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-100" readonly>
                </div>
            </div>
        </header>

        <!-- 盤點區塊 -->
        <main>
            <div id="products-container" class="space-y-6">
                <!-- 商品區塊會由 JS 動態生成 -->
            </div>
            
            <button onclick="addNewProduct()" class="mt-6 w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded-md shadow-sm transition">
                + 新增其他商品
            </button>
        </main>

        <!-- 總表與輸出 -->
        <section class="mt-12 bg-white p-4 sm:p-6 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">盤點數量總表</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700">
                            <th class="p-3 border-b font-medium">商品名稱</th>
                            <th class="p-3 border-b font-medium text-right">照片張數</th>
                            <th class="p-3 border-b font-medium text-right text-blue-600">人工確認總數</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body">
                        <!-- 總表動態生成 -->
                    </tbody>
                </table>
            </div>
            <div class="mt-6 flex flex-col sm:flex-row gap-4">
                <button onclick="exportCSV()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-md font-medium shadow-sm text-center">
                    下載 CSV 報表
                </button>
                <button onclick="exportImages()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-md font-medium shadow-sm text-center">
                    下載已標記照片 (盤點紀錄)
                </button>
            </div>
        </section>
    </div>

    <!-- 圖片編輯/標記 Modal -->
    <div id="editor-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex flex-col">
        <div class="p-4 bg-white flex justify-between items-center shadow-md">
            <div>
                <h3 class="font-bold text-lg inline-block mr-4">點選照片進行標記</h3>
                <span class="text-sm text-gray-600">目前數量: <span id="modal-count" class="font-bold text-blue-600 text-lg">0</span></span>
            </div>
            <div class="flex gap-2">
                <button onclick="zoomCanvas(0.2)" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm">放大 +</button>
                <button onclick="zoomCanvas(-0.2)" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm">縮小 -</button>
                <button onclick="undoMarker()" class="px-3 py-1 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded text-sm">復原上一步</button>
                <button onclick="clearMarkers()" class="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-800 rounded text-sm">清除全部</button>
                <button onclick="closeEditor()" class="px-4 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium ml-2">完成</button>
            </div>
        </div>
        <div class="flex-1 canvas-container relative" id="canvas-wrapper">
            <!-- 隱藏的原始圖片，用來繪製到 canvas -->
            <img id="modal-source-img" class="hidden">
            <canvas id="modal-canvas" onclick="addMarker(event)"></canvas>
        </div>
    </div>

    <script>
        // 預設商品清單 (可在此處自由修改)
        const DEFAULT_PRODUCTS = [
            "多醣體保濕精華", 
            "植物油修護精華乳", 
            "酵素溫和潔顏露",
            "aMMour 亮白面膜",
            "深層潤澤護手霜"
        ];

        let appState = { products: [] };
        let currentEdit = { productId: null, photoId: null, zoom: 1 };

        window.onload = () => {
            document.getElementById('inventory-date').valueAsDate = new Date();
            appState.products = DEFAULT_PRODUCTS.map(name => createProductObj(name));
            renderApp();
        };

        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function createProductObj(name) { return { id: generateId(), name: name, photos: [] }; }

        function addNewProduct() {
            const name = prompt("請輸入新商品名稱：");
            if (name && name.trim() !== "") {
                appState.products.push(createProductObj(name.trim()));
                renderApp();
            }
        }

        // ================= UI 渲染 =================
        function renderApp() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            appState.products.forEach(product => {
                const productEl = document.createElement('div');
                productEl.className = 'bg-white p-4 sm:p-5 rounded-lg shadow-sm border border-gray-200';
                
                let photosHtml = product.photos.map(photo => `
                    <div class="border rounded-md p-2 bg-gray-50 flex flex-col gap-2">
                        <div class="relative group cursor-pointer" onclick="openEditor('${product.id}', '${photo.id}')">
                            <img src="${photo.dataURL}" class="w-full h-32 object-cover rounded border">
                            <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded">
                                <span class="text-white text-sm font-medium">點擊放大標記</span>
                            </div>
                            ${photo.markers.length > 0 ? `<div class="absolute top-1 right-1 bg-blue-600 text-white text-xs px-2 py-1 rounded-full shadow">標記: ${photo.markers.length}</div>` : ''}
                        </div>
                        
                        <div class="mt-1">
                            <label class="text-xs text-gray-500 block mb-1">確認數量 (可修改)</label>
                            <input type="number" min="0" value="${photo.manualCount}" 
                                onchange="updateManualCount('${product.id}', '${photo.id}', this.value)"
                                class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <button id="ai-btn-${photo.id}" onclick="runAI('${product.id}', '${photo.id}', false)" 
                            class="text-xs w-full py-1.5 rounded border border-purple-300 text-purple-700 bg-purple-50 hover:bg-purple-100 transition flex items-center justify-center gap-1">
                            單張 AI 辨識
                        </button>
                        
                        <button onclick="deletePhoto('${product.id}', '${photo.id}')" class="text-xs text-red-500 hover:text-red-700 mt-1">移除照片</button>
                    </div>
                `).join('');

                // 只有當照片大於 1 張時，才顯示「批次處理」按鈕
                const batchBtnHtml = product.photos.length > 1 
                    ? `<button id="batch-btn-${product.id}" onclick="runBatchAI('${product.id}')" class="text-sm bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded shadow-sm flex items-center gap-1">
                        ▶️ 批次 AI 辨識 (依序延遲處理)
                       </button>` 
                    : ``;

                productEl.innerHTML = `
                    <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <span class="w-2 h-6 bg-blue-500 rounded-sm"></span> ${product.name}
                        </h2>
                        <div class="flex items-center gap-3">
                            ${batchBtnHtml}
                            <span class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">
                                總計: ${product.photos.reduce((sum, p) => sum + p.manualCount, 0)}
                            </span>
                        </div>
                    </div>
                    
                    <div class="drop-zone rounded-lg p-6 text-center text-gray-500 cursor-pointer mb-4" 
                        onclick="document.getElementById('file-${product.id}').click()"
                        ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${product.id}')">
                        <p class="text-sm sm:text-base">點擊或拖曳照片至此處上傳</p>
                        <input type="file" id="file-${product.id}" multiple accept="image/*" class="hidden" onchange="handleFiles(this.files, '${product.id}')">
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                        ${photosHtml}
                    </div>
                `;
                container.appendChild(productEl);
            });
            updateSummaryTable();
        }

        function updateSummaryTable() {
            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = appState.products.map(p => {
                const total = p.photos.reduce((sum, photo) => sum + photo.manualCount, 0);
                if (p.photos.length === 0) return '';
                return `
                    <tr class="border-b last:border-0 hover:bg-gray-50">
                        <td class="p-3">${p.name}</td>
                        <td class="p-3 text-right text-gray-500">${p.photos.length} 張</td>
                        <td class="p-3 text-right font-bold text-blue-600 text-lg">${total}</td>
                    </tr>
                `;
            }).join('');
        }

        // ================= 照片處理 =================
        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
        function handleDragLeave(e) { e.preventDefault(); e.currentTarget.classList.remove('dragover'); }
        function handleDrop(e, productId) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            handleFiles(e.dataTransfer.files, productId);
        }

        function handleFiles(files, productId) {
            const product = appState.products.find(p => p.id === productId);
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    product.photos.push({
                        id: generateId(),
                        file: file,
                        dataURL: e.target.result,
                        markers: [],
                        manualCount: 0
                    });
                    renderApp();
                };
                reader.readAsDataURL(file);
            });
        }

        function deletePhoto(productId, photoId) {
            if(!confirm('確定要移除這張照片嗎？')) return;
            const product = appState.products.find(p => p.id === productId);
            product.photos = product.photos.filter(p => p.id !== photoId);
            renderApp();
        }

        function updateManualCount(productId, photoId, val) {
            const photo = appState.products.find(p => p.id === productId).photos.find(p => p.id === photoId);
            photo.manualCount = parseInt(val) || 0;
            updateSummaryTable();
            renderApp(); 
        }

        // ================= 畫布標記 =================
        const canvas = document.getElementById('modal-canvas');
        const ctx = canvas.getContext('2d');
        const sourceImg = document.getElementById('modal-source-img');

        function openEditor(productId, photoId) {
            currentEdit = { productId, photoId, zoom: 1 };
            const photo = appState.products.find(p => p.id === productId).photos.find(p => p.id === photoId);
            sourceImg.onload = () => {
                canvas.width = sourceImg.naturalWidth;
                canvas.height = sourceImg.naturalHeight;
                drawCanvas();
                document.getElementById('editor-modal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                applyZoom();
            };
            sourceImg.src = photo.dataURL;
        }

        function closeEditor() {
            document.getElementById('editor-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            const photo = appState.products.find(p => p.id === currentEdit.productId).photos.find(p => p.id === currentEdit.photoId);
            photo.manualCount = photo.markers.length;
            renderApp();
        }

        function drawCanvas() {
            const photo = appState.products.find(p => p.id === currentEdit.productId).photos.find(p => p.id === currentEdit.photoId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(sourceImg, 0, 0);
            photo.markers.forEach(marker => {
                const radius = Math.max(15, canvas.width * 0.015);
                ctx.beginPath();
                ctx.arc(marker.x, marker.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'white';
                ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.font = `bold ${radius}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(marker.number, marker.x, marker.y + (radius*0.1));
            });
            document.getElementById('modal-count').innerText = photo.markers.length;
        }

        function addMarker(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            const photo = appState.products.find(p => p.id === currentEdit.productId).photos.find(p => p.id === currentEdit.photoId);
            photo.markers.push({ x: x, y: y, number: photo.markers.length + 1 });
            drawCanvas();
        }

        function undoMarker() {
            const photo = appState.products.find(p => p.id === currentEdit.productId).photos.find(p => p.id === currentEdit.photoId);
            if (photo.markers.length > 0) { photo.markers.pop(); drawCanvas(); }
        }

        function clearMarkers() {
            if(!confirm('確定要清除所有標記嗎？')) return;
            const photo = appState.products.find(p => p.id === currentEdit.productId).photos.find(p => p.id === currentEdit.photoId);
            photo.markers = [];
            drawCanvas();
        }

        function zoomCanvas(delta) {
            currentEdit.zoom += delta;
            if (currentEdit.zoom < 0.2) currentEdit.zoom = 0.2;
            if (currentEdit.zoom > 3) currentEdit.zoom = 3;
            applyZoom();
        }
        function applyZoom() { canvas.style.transform = `scale(${currentEdit.zoom})`; }

        // ================= 延遲與批次 AI 機制 =================
        
        // 建立等待函數 (Delay function)
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        let aiDetector = null;

        // 批次執行該商品所有照片的 AI
        async function runBatchAI(productId) {
            const product = appState.products.find(p => p.id === productId);
            const batchBtn = document.getElementById(`batch-btn-${productId}`);
            
            // 變更按鈕狀態避免重複點擊
            batchBtn.disabled = true;
            batchBtn.innerHTML = `⏳ 批次處理中...請稍候`;
            batchBtn.classList.replace('bg-purple-600', 'bg-gray-400');

            // 迴圈：一張一張依序處理
            for (let i = 0; i < product.photos.length; i++) {
                const photo = product.photos[i];
                
                // 傳入 true 代表是批次模式，不會每張彈出 alert 視窗
                await runAI(productId, photo.id, true);
                
                // 【關鍵】如果不是最後一張照片，就強制等待 4 秒鐘 (4000 毫秒)
                // 這樣可以完美避開 API 的「每分鐘頻率限制 (Rate Limits)」
                if (i < product.photos.length - 1) {
                    batchBtn.innerHTML = `⏳ 倒數等待 ${i+1}/${product.photos.length}...`;
                    await sleep(4000); 
                }
            }

            // 完成後恢復按鈕
            alert(`${product.name} 的所有照片已批次 AI 辨識完成！`);
            renderApp();
        }

        // 單張 AI 執行邏輯 (加入 isBatch 參數判斷)
        async function runAI(productId, photoId, isBatch = false) {
            const btn = document.getElementById(`ai-btn-${photoId}`);
            btn.innerHTML = `<span class="animate-pulse">載入中...</span>`;
            btn.disabled = true;
            btn.classList.replace('text-purple-700', 'text-gray-500');
            btn.classList.replace('border-purple-300', 'border-gray-300');

            try {
                if (!aiDetector) {
                    const module = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
                    module.env.allowLocalModels = false;
                    aiDetector = await module.pipeline('object-detection', 'Xenova/detr-resnet-50');
                }

                const photo = appState.products.find(p => p.id === productId).photos.find(p => p.id === photoId);
                const results = await aiDetector(photo.dataURL);
                
                let newMarksCount = 0;
                // 為了避免重複標記，批次執行前先清除舊標記
                photo.markers = []; 
                
                results.forEach(res => {
                    if(res.score > 0.7) {
                        const cx = (res.box.xmin + res.box.xmax) / 2;
                        const cy = (res.box.ymin + res.box.ymax) / 2;
                        photo.markers.push({ x: cx, y: cy, number: photo.markers.length + 1 });
                        newMarksCount++;
                    }
                });
                
                photo.manualCount = photo.markers.length;
                
                // 如果是單張手動點擊，才跳出提示窗
                if (!isBatch) {
                    if(newMarksCount > 0) alert(`AI 辨識完成！共標記了 ${newMarksCount} 個可能物件。`);
                    else alert(`AI 未發現明顯相符的物件，請改用人工點選標記。`);
                    renderApp(); 
                }

            } catch (error) {
                console.error("AI 辨識失敗:", error);
                if (!isBatch) alert("AI 辨識失敗，請稍後再試。");
            } finally {
                btn.innerHTML = `已完成`;
                // 避免在批次中頻繁重繪整個畫面影響效能，單張才立刻重繪
                if(!isBatch) renderApp();
                else updateSummaryTable(); // 批次時只更新左下數字與總表
            }
        }

        // ================= 匯出 CSV 與圖片 =================
        function exportCSV() {
            const salesName = document.getElementById('sales-name').value || '未提供姓名';
            const date = document.getElementById('inventory-date').value;
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "業務姓名,日期,商品名稱,照片張數,人工確認總數\n";
            let hasData = false;
            appState.products.forEach(p => {
                if (p.photos.length > 0) {
                    hasData = true;
                    const total = p.photos.reduce((sum, photo) => sum + photo.manualCount, 0);
                    csvContent += `${salesName},${date},${p.name},${p.photos.length},${total}\n`;
                }
            });
            if (!hasData) return alert("目前沒有任何資料可匯出。");
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = `盤點表_${salesName}_${date}.csv`;
            link.click();
        }

        function generateMarkedDataURL(photo) {
            return new Promise((resolve) => {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    tempCanvas.width = img.naturalWidth;
                    tempCanvas.height = img.naturalHeight;
                    tempCtx.drawImage(img, 0, 0);
                    photo.markers.forEach(marker => {
                        const radius = Math.max(15, tempCanvas.width * 0.015);
                        tempCtx.beginPath();
                        tempCtx.arc(marker.x, marker.y, radius, 0, 2 * Math.PI);
                        tempCtx.fillStyle = 'rgba(239, 68, 68, 0.8)';
                        tempCtx.fill();
                        tempCtx.lineWidth = 3;
                        tempCtx.strokeStyle = 'white';
                        tempCtx.stroke();
                        tempCtx.fillStyle = 'white';
                        tempCtx.font = `bold ${radius}px Arial`;
                        tempCtx.textAlign = 'center';
                        tempCtx.textBaseline = 'middle';
                        tempCtx.fillText(marker.number, marker.x, marker.y + (radius*0.1));
                    });
                    resolve(tempCanvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = photo.dataURL;
            });
        }

        async function exportImages() {
            const date = document.getElementById('inventory-date').value;
            let exportedCount = 0;
            for (const product of appState.products) {
                for (let i = 0; i < product.photos.length; i++) {
                    const photo = product.photos[i];
                    if (photo.markers.length > 0) {
                        const dataUrl = await generateMarkedDataURL(photo);
                        const link = document.createElement("a");
                        link.href = dataUrl;
                        link.download = `${date}_${product.name}_相片${i+1}.jpg`;
                        link.click();
                        exportedCount++;
                        await sleep(300); // 匯出圖片也加上微小延遲避免瀏覽器當機
                    }
                }
            }
            if (exportedCount === 0) alert("沒有包含「標記」的照片可供下載。");
        }
    </script>
</body>
</html>
